[project]
name = "mendspeech"
version = "0.1.0"
description = "Meaning-preserving dictation with measured quality and latency"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "gradio>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "speechdamagebench"]
testpaths = ["tests", "speechdamagebench/tests"]
